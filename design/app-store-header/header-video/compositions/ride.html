  <script src="assets/route-data.js"></script>
  <script>
    (() => {
      const W = 3840, H = 1646, DUR = 20;
      const R = window.CT_ROUTE, P = R.points, C = R.cum, L = C[C.length - 1];
      const MPP = R.metresPerPx;                 // metres per mosaic pixel
      const K0 = W / (1200 / MPP);               // frame ≈ 1200 m wide

      // ---- Ride model: everything is a function of t ----
      const meS = (t) => 900 + 37.5 * t;         // your position along the route, metres
      const TAU = Math.PI * 2;
      const riders = [
        { key: "arjun", off: 290, amp: 18, ph: 0.0 },
        { key: "meera", off: 130, amp: 14, ph: 1.7 },
        { key: "kabir", off: -150, amp: 20, ph: 3.1 },
      ];
      const gap = (r, t) => r.off + r.amp * Math.sin(TAU * t / DUR + r.ph);  // periodic, so the loop matches
      const PIN_S = 1858;                        // Google's "Rock photo points at Nandi hills"

      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
      const ramp = (t, a, b) => smooth((t - a) / (b - a));
      const env = (t, a, b, c, d) => Math.min(ramp(t, a, b), 1 - ramp(t, c, d));
      const expoOut = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(x, 0, 1)));

      function at(s) {
        s = clamp(s, 0, L);
        let lo = 0, hi = C.length - 1;
        while (hi - lo > 1) { const m = (lo + hi) >> 1; if (C[m] <= s) lo = m; else hi = m; }
        const f = (s - C[lo]) / Math.max(1e-6, C[hi] - C[lo]);
        const a = P[lo], b = P[hi];
        return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f, dx: b[0] - a[0], dy: b[1] - a[1] };
      }
      const fmt = (m) => { m = Math.abs(m); return m >= 1000 ? (m / 1000).toFixed(1) + " km" : Math.round(m / 10) * 10 + " m"; };

      // Camera: the pack's centroid, averaged over a 1 s window so the road's vertices don't jitter it.
      function camera(t) {
        let x = 0, y = 0, n = 0;
        for (let i = -5; i <= 5; i++) {
          const tt = t + i * 0.1, s = meS(tt);
          for (const o of [0, ...riders.map((r) => gap(r, tt))]) { const p = at(s + o); x += p.x; y += p.y; n++; }
        }
        const zoom = 1 + 0.07 * env(t, 0.8, 3.6, 15.4, 18.6);
        return { cx: x / n, cy: y / n, k: K0 * zoom };
      }

      // ---- Build both stages ----
      let d = "M" + P.map((p) => p[0] + " " + p[1]).join(" L");
      const stageA = document.getElementById("ride-stage-a");
      const stageB = stageA.cloneNode(true);
      stageB.id = "ride-stage-b";
      stageA.after(stageB);

      function wire(stage) {
        const q = (s) => stage.querySelector(s);
        for (const c of ["planned", "casing", "core"]) {
          const el = q("." + c);
          el.setAttribute("d", d);
          el.setAttribute("pathLength", L);
        }
        return {
          stage, world: q(".world"), planned: q(".planned"), casing: q(".casing"), core: q(".core"),
          me: q(".me"), chev: q(".chev"), pin: q(".rpin"), km: q(".turn .km"),
          riders: riders.map((r) => {
            const el = [...stage.getElementsByClassName("rider")].find((n) => n.dataset.rider === r.key);
            return { r, el, name: el.querySelector(".name"), dist: el.querySelector(".dist") };
          }),
        };
      }
      const A = wire(stageA), B = wire(stageB);

      function renderStage(S, t) {
        const cam = camera(t);
        const ax = W * 0.7, ay = H * 0.5;             // where the pack sits on screen
        const tx = ax - cam.cx * cam.k, ty = ay - cam.cy * cam.k;
        S.world.style.transform = `translate(${tx}px, ${ty}px) scale(${cam.k})`;
        const scr = (p) => [tx + p.x * cam.k, ty + p.y * cam.k];

        // Route widths are screen pixels (3.2 px/pt), divided by the camera scale.
        const s = meS(t);
        S.planned.setAttribute("stroke-width", 9.6 / cam.k);
        S.casing.setAttribute("stroke-width", 41.6 / cam.k);
        S.core.setAttribute("stroke-width", 25.6 / cam.k);
        const ahead = `0 ${s} ${L}`;
        S.casing.setAttribute("stroke-dasharray", ahead);
        S.core.setAttribute("stroke-dasharray", ahead);

        // You: the lime chevron, pointing along the road.
        const m = at(s), [mx, my] = scr(m);
        const ang = Math.atan2(m.dx, -m.dy) * 180 / Math.PI;
        S.me.style.transform = `translate(${mx}px, ${my}px)`;
        S.chev.setAttribute("transform", `rotate(${ang})`);

        // Beat 1 lights the name tags, beat 2 grows the distance tags.
        S.riders.forEach((o, i) => {
          const g = gap(o.r, t), p = at(s + g), [x, y] = scr(p);
          o.el.style.transform = `translate(${x}px, ${y}px)`;
          o.dist.textContent = fmt(g);
          const h1 = env(t, 0.9 + i * 0.15, 1.4 + i * 0.15, 4.6, 5.1);
          o.name.style.boxShadow = `inset 0 0 0 ${4 * h1}px rgba(205,239,30,${h1})`;
          o.name.style.background = `rgba(${26 + 30 * h1}, ${26 + 40 * h1}, ${26 + 4 * h1}, ${0.75 + 0.15 * h1})`;
          const h2 = env(t, 5.6 + i * 0.12, 6.2 + i * 0.12, 9.3, 9.8);
          o.dist.style.transform = `translate(-50%, 0) scale(${1 + 0.22 * h2})`;
          o.dist.style.boxShadow = `inset 0 0 0 ${4 * h2}px rgba(205,239,30,${h2})`;
          o.name.style.transform = "translate(-50%, 0)";
        });

        // Regroup pin: lands at 10.6 s, leaves with the banner before Arjun reaches it.
        const pinIn = expoOut((t - 10.6) / 0.7), pinOut = ramp(t, 15.0, 15.5);
        const pp = at(PIN_S), [px, py] = scr(pp);
        S.pin.style.opacity = t < 10.6 ? 0 : clamp(pinIn, 0, 1) * (1 - pinOut);
        S.pin.style.transform = `translate(${px}px, ${py - 70 * (1 - pinIn)}px)`;

        S.km.textContent = fmt(L - s);
      }

      // Loop seam: stage B holds the frame-0 state. Over the last 0.6 s A blurs out while B blurs in,
      // so frame 599 hands off to frame 0 without a jump.
      renderStage(B, 0);
      const state = { t: 0 };
      const render = () => {
        renderStage(A, state.t);
        const fade = ramp(state.t, 19.37, 19.967);
        stageA.style.opacity = 1 - fade;
        stageA.style.filter = fade > 0 ? `blur(${14 * fade}px)` : "none";
        stageB.style.opacity = fade;
        stageB.style.filter = fade > 0 && fade < 1 ? `blur(${14 * (1 - fade)}px)` : "none";
        stageB.style.visibility = fade > 0 ? "visible" : "hidden";
      };
      render();

      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: render }, 0);

      // ---- Text ----
      const words = (id) => document.getElementById(id).getElementsByClassName("w");
      const blurIn = (id, at) => tl.fromTo(words(id), { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, at);
      const blurOut = (id, at) => tl.to(words(id), { opacity: 0, filter: "blur(8px)", duration: 0.2, stagger: 0.03, ease: "power2.in" }, at);

      blurIn("ride-f1", 0.8);
      blurOut("ride-f1", 4.85);

      // Beat 2: words arrive grey and turn to ink, no movement.
      tl.fromTo(words("ride-f2"), { opacity: 0, color: "#5c636d" }, { opacity: 1, duration: 0.1, stagger: 0.09, ease: "none" }, 5.4);
      tl.to(document.querySelectorAll("#ride-f2 .w:not(.lime)"), { color: "#f5f7fa", duration: 0.25, stagger: 0.09 }, 5.5);
      tl.to(document.querySelectorAll("#ride-f2 .lime"), { color: "#cdef1e", duration: 0.25 }, 5.68);
      blurOut("ride-f2", 9.6);

      // Beat 3: the whole line blurs in at once.
      tl.fromTo("#ride-f3 .line", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 10.2);
      tl.to("#ride-f3 .line", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 14.95);

      blurIn("ride-f4", 15.4);
      blurOut("ride-f4", 18.95);

      // Regroup banner: arrives with the pin, leaves before the tagline.
      tl.fromTo("#ride-banner .card", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 10.5);
      tl.to("#ride-banner .card", { opacity: 0, y: -20, duration: 0.35, ease: "power3.in" }, 15.0);

      window.__timelines["ride"] = tl;
    })();
  </script>
