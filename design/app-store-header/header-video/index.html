<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=1646" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 3840px; height: 1646px; overflow: hidden; background: #11191d; }
    </style>
  </head>
  <body>
    <!-- App Store product page header: 21:9, 3840x1646, 30 fps, 20 s, silent, loops. See SPEC.md. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="3840"
      data-height="1646"
    >
      <div
        id="ride"
        data-composition-id="ride"
        data-composition-src="compositions/ride.html"
        data-start="0"
        data-duration="20"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="3840"
        data-height="1646"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
